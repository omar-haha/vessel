<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <!-- Favicon / app icon. Replaces a leftover mark from the codebase this was
       forked from (it literally spelled out that project's old name) with a
       monogram actually drawn from the VESSEL wordmark's own "V" stroke
       (see components/ui/BrandLogo.tsx) — same rounded-square treatment,
       one glyph, legible down to 16px. The accent dot is a small nod to
       "vessel" as in a container for liquid. -->
  <rect width="160" height="160" rx="36" fill="#000000"/>
  <path
    d="M 44 44 L 80 116 L 116 44"
    fill="none"
    stroke="#ffffff"
    stroke-width="16"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="80" cy="132" r="7" fill="#2997ff"/>
</svg>
